<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  <!-- Math symbols in harmonious composition -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Square root + Sigma stylized -->
    <path d="M120 280 L160 360 L210 160 L400 160" stroke-width="36"/>
    <!-- Algebra 'x' -->
    <path d="M260 250 L340 350" stroke-width="32"/>
    <path d="M340 250 L260 350" stroke-width="32"/>
    <!-- Plus symbol in corner -->
    <path d="M390 220 L390 260" stroke-width="24"/>
    <path d="M370 240 L410 240" stroke-width="24"/>
  </g>
</svg>
